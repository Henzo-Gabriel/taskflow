<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Organize suas tarefas e conquiste seus objetivos com o TaskFlow.">
  <title>TaskFlow | Gerenciador de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>TaskFlow.</h1>
    <p>Organize suas tarefas. Conquiste seus objetivos.</p>
  </header>

  <main>
    <section class="stats">
      <div class="stat">
        <span>Total</span>
        <strong id="total">0</strong>
      </div>

      <div class="stat">
        <span>Pendentes</span>
        <strong id="pending">0</strong>
      </div>

      <div class="stat">
        <span>Concluídas</span>
        <strong id="completed">0</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Minhas tarefas</h2>

      <form id="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="Ex.: Estudar JavaScript"
          maxlength="120"
          required
        >
        <button class="add" type="submit">+ Adicionar</button>
      </form>

      <div class="filters">
        <button class="filter active" data-filter="all" type="button">Todas</button>
        <button class="filter" data-filter="pending" type="button">Pendentes</button>
        <button class="filter" data-filter="completed" type="button">Concluídas</button>
      </div>

      <ul id="task-list"></ul>
      <p id="empty">Nenhuma tarefa por aqui. Adicione a primeira!</p>
    </section>
  </main>

  <footer>
    TaskFlow © 2026 · Feito para organizar seu dia.
  </footer>
</body>
</html>
